<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>თანამედროვე 24-საათიანი წამზომი</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030712;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
            --glow-color: rgba(16, 185, 129, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            /* ფონზე დამატებულია ბადისებრი (grid) სტრუქტურა */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.07) 0%, transparent 60%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ანიმირებული ფონის კონვასის სტილი */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* ფონი არის ყველაზე ქვედა ფენაზე */
            opacity: 0.6;
        }

        /* მთავარი წამზომის კონტეინერი (ინფორმაცია ზედა ფენაზეა z-index-ით) */
        .timer-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90vmin;
            height: 90vmin;
            max-width: 850px;
            max-height: 850px;
            z-index: 10; 
        }

        /* SVG წრიული პროგრეს-ბარი */
        .progress-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring__circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .progress-ring__circle {
            fill: none;
            stroke: var(--accent-green);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 2512; /* 2 * PI * r (r = 400) */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            /* დამატებულია რბილი ნეონის ეფექტი */
            filter: drop-shadow(0 0 8px var(--accent-green));
        }

        /* ცენტრში განთავსებული ტექსტი და ციფრები */
        .timer-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .timer-label {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 300;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 6px;
            /* ტექსტსაც დაემატა ოდნავი ნათება */
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .timer-display {
            font-size: 8.5vw;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--text-primary);
            /* ციფრების ძლიერი ნეონის ნათება */
            text-shadow: 0 0 15px var(--accent-green), 
                         0 0 30px var(--accent-green),
                         0 0 45px var(--accent-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .separator {
            color: rgba(16, 185, 129, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* მობილურის ადაპტაცია */
        @media (max-width: 768px) {
            .timer-display {
                font-size: 12vw;
                letter-spacing: 3px;
            }
            .timer-label {
                font-size: 1rem;
                letter-spacing: 3px;
            }
            body {
                background-size: 100% 100%, 25px 25px, 25px 25px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="timer-wrapper">
        <svg class="progress-ring" viewBox="0 0 900 900">
            <circle class="progress-ring__circle-bg" cx="450" cy="450" r="400"></circle>
            <circle id="progressCircle" class="progress-ring__circle" cx="450" cy="450" r="400"></circle>
        </svg>

        <div class="timer-content">
            <div class="timer-label">დარჩენილია</div>
            <div class="timer-display">
                <span id="hours">00</span><span class="separator">:</span><span id="minutes">00</span><span class="separator">:</span><span id="seconds">00</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. წამზომის ლოგიკა ---
        const radius = 400;
        const circumference = 2 * Math.PI * radius;
        const circle = document.getElementById('progressCircle');
        
        circle.style.strokeDasharray = circumference;

        function updateTimer() {
            const now = new Date();
            
            let targetTime = new Date();
            targetTime.setHours(9, 0, 0, 0);

            const totalCycleTime = 24 * 60 * 60 * 1000;

            if (now >= targetTime) {
                targetTime.setDate(targetTime.getDate() + 1);
            }

            const diff = targetTime - now;

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            let progressFraction = diff / totalCycleTime;
            if (progressFraction > 1) progressFraction = 1;
            if (progressFraction < 0) progressFraction = 0;
            
            const offset = circumference - (progressFraction * circumference);
            circle.style.strokeDashoffset = offset;
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // --- 2. ფონის ანიმაციის ლოგიკა (Canvas) ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 150; // ვარსკვლავების რაოდენობა

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * width,
                    o: Math.random() // Opacity
                });
            }
        }

        function moveStars() {
            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                star.z -= 1; // სიჩქარე (მოძრაობა კამერისკენ)

                if (star.z <= 0) {
                    star.z = width;
                    star.x = Math.random() * width;
                    star.y = Math.random() * height;
                }
            }
        }

        function drawStars() {
            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                
                // პერსპექტივის გამოთვლა 2D სივრცეში
                const x = (star.x - width / 2) * (width / star.z) + width / 2;
                const y = (star.y - height / 2) * (width / star.z) + height / 2;
                
                // ზომა და სიკაშკაშე დამოკიდებული z-ზე (სიღრმეზე)
                const px = (width / star.z) * 1.5;
                
                ctx.beginPath();
                ctx.arc(x, y, px, 0, Math.PI * 2);
                // ვარსკვლავების ფერი ოდნავ მწვანე ელფერით
                ctx.fillStyle = `rgba(16, 185, 129, ${1 - star.z / width})`;
                ctx.fill();
            }
        }

        function animate() {
            moveStars();
            drawStars();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        createStars();
        animate();

    </script>
</body>
</html>
