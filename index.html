<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>დოკუმენტების მართვა</title>
    
    <!-- PDF.js (ვიზუალური ჩვენებისთვის) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- pdf-lib (ორიგინალი ხარისხის შენარჩუნებით ხელმოსაწერად და შესანახად) -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --bg-color: #f3f4f6; --panel-bg: #ffffff;
            --text-dark: #1f2937; --text-light: #6b7280; --border: #e5e7eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); height: 100vh; overflow: hidden; }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4338ca;
        }
        /* ------------------------ */

        #login-page {
            display: flex; height: 100vh; align-items: center; justify-content: center;
            background: url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            position: relative;
        }
        #login-page::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px);
        }
        .login-card {
            position: relative; background: rgba(255, 255, 255, 0.95); padding: 40px 35px;
            border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 440px; text-align: center; z-index: 1;
        }
        .login-illustration {
            margin-bottom: 25px; display: flex; justify-content: center; width: 100%;
        }
        .login-illustration svg { width: 100%; max-width: 220px; height: auto; display: block; margin: 0 auto; }
        .login-card h2 { margin-bottom: 25px; color: var(--text-dark); font-size: 24px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-light); font-weight: 600; }
        .login-card input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
        .login-card input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .login-card button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .login-card button:hover { background: var(--primary-hover); }

        #app-container { display: none; flex-direction: column; height: 100vh; width: 100vw; }
        .topbar { background: var(--panel-bg); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo-nav { display: flex; align-items: center; gap: 30px; }
        .logo-nav h2 { display: flex; align-items: center; gap: 10px; color: var(--primary); cursor: pointer; font-size: 20px; }
        .nav-links button { background: none; border: none; font-size: 16px; color: var(--text-light); cursor: pointer; font-weight: 600; padding: 8px 12px; border-radius: 6px; transition: 0.2s; }
        .nav-links button:hover, .nav-links button.active { color: var(--primary); background: #eef2ff; }
        .user-actions { display: flex; align-items: center; gap: 15px; }
        
        .btn { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.3s; text-decoration: none; justify-content: center; }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-dark); }
        .btn-outline:hover { background: var(--bg-color); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        .workspace-wrapper { display: flex; flex: 1; overflow: hidden; }
        .toolbar { width: 300px; background: var(--panel-bg); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        .file-upload-wrapper { position: relative; width: 100%; }
        .file-upload-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .upload-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 15px; border: 2px dashed var(--border); border-radius: 8px; background: var(--bg-color); color: var(--text-light); text-align: center; font-size: 13px; font-weight: 600; }
        .file-upload-wrapper:hover .upload-btn { border-color: var(--primary); color: var(--primary); }

        .doc-name-group { display: flex; flex-direction: column; gap: 5px; }
        .doc-name-group label { font-size: 13px; font-weight: 600; color: var(--text-light); }
        .doc-name-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        .doc-name-group input:focus { outline: none; border-color: var(--primary); }

        .canvas-area { flex: 1; overflow: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; background: #cbd5e1; position: relative; }
        #canvas-container { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 900px; align-items: center; }
        
        .empty-placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-light); gap: 15px; margin: auto; font-size: 18px; font-weight: 600; text-align: center;
        }

        .page-wrapper { position: relative; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.15); background: white; margin-bottom: 20px; }
        canvas.pdf-page { display: block; cursor: crosshair; width: 100% !important; height: auto !important; }

        .signature-overlay {
            position: absolute; cursor: move; border: 2px dashed var(--primary);
            background: rgba(79, 70, 229, 0.05); user-select: none; padding: 5px; touch-action: none;
        }
        .signature-overlay img { display: block; width: 100%; height: 100%; pointer-events: none; }
        
        .sig-delete {
            position: absolute; top: -12px; right: -12px; background: #ef4444; color: white;
            border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold;
            font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .sig-rotate {
            position: absolute; top: -12px; left: -12px; background: #10b981; color: white;
            border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold;
            font-size: 12px; cursor: grab; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .sig-resize {
            position: absolute; bottom: -6px; right: -6px; width: 14px; height: 14px;
            background: var(--primary); border: 2px solid white; border-radius: 50%; cursor: nwse-resize; z-index: 10;
        }

        #archive-view { display: none; flex: 1; padding: 30px; overflow-y: auto; background: var(--bg-color); flex-direction: column; gap: 20px; }
        .archive-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .search-box { padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; width: 300px; font-size: 14px; background: white; }
        .search-box:focus { outline: none; border-color: var(--primary); }

        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .archive-item { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: transform 0.2s; }
        .archive-item:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .archive-thumb { height: 160px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .archive-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* Modal Preview Popup (Wider) */
        #preview-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; border-radius: 12px; width: 94vw; height: 90vh; max-width: 1700px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; align-items: center; background: #cbd5e1; position: relative; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; align-items: center; gap: 10px; }

        /* Loading Overlay & Writing Animation */
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.85); z-index: 99999; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
        .loading-animation-wrapper { width: 160px; height: 80px; display: flex; align-items: center; justify-content: center; position: relative; }
        .writing-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawWriting 1.5s ease-in-out infinite;
        }
        @keyframes drawWriting {
            0% { stroke-dashoffset: 100; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -100; }
        }
        .loading-text { font-weight: 600; color: var(--text-dark); font-size: 16px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 15px 20px; background: white; color: var(--text-dark); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-weight: 600; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border-left: 5px solid; display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: #ef4444; }
        .toast.success { border-left-color: #10b981; }
        .toast.info { border-left-color: var(--primary); }
        
        svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="loading-overlay">
        <div class="loading-animation-wrapper">
            <svg viewBox="0 0 150 75" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto;">
                <rect x="15" y="8" width="120" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                <line x1="30" y1="20" x2="120" y2="20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                <line x1="30" y1="30" x2="90" y2="30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                <line x1="30" y1="48" x2="120" y2="48" stroke="#4f46e5" stroke-width="2" stroke-dasharray="3 3"/>
                <path class="writing-path" d="M35 50 C 42 38, 52 56, 62 42 C 68 35, 74 48, 84 44 C 90 41, 96 46, 102 40" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" fill="none"/>
            </svg>
        </div>
        <div class="loading-text" id="loading-msg">გთხოვთ მოიცადოთ...</div>
    </div>

    <!-- Modal Preview Popup -->
    <div id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title">გადახედვა</span>
                <button class="btn btn-outline" style="padding: 5px 10px;" onclick="closeModal()">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body" id="modal-pdf-container">
                <!-- პერსონალური PDF კანვასები ჩაიტვირთება აქ -->
            </div>
            <div class="modal-footer" id="modal-footer-actions"></div>
        </div>
    </div>

    <!-- Login Page -->
    <div id="login-page">
        <div class="login-card" onkeydown="if(event.key === 'Enter') window.login();">
            <div class="login-illustration">
                <svg viewBox="0 0 150 75" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="8" width="120" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                    <line x1="30" y1="20" x2="120" y2="20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="30" y1="30" x2="90" y2="30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="30" y1="48" x2="120" y2="48" stroke="#4f46e5" stroke-width="2" stroke-dasharray="3 3"/>
                    <path d="M35 50 C 42 38, 52 56, 62 42 C 68 35, 74 48, 84 44 C 90 41, 96 46, 102 40" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" fill="none"/>
                </svg>
            </div>
            <h2>ShogiSign</h2>
            <div class="input-group"><label>მომხმარებელი</label><input type="text" id="username" value="alex"></div>
            <div class="input-group"><label>პაროლი</label><input type="password" id="password" value="2911"></div>
            <button type="button" onclick="window.login()">შესვლა</button>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container">
        <header class="topbar">
            <div class="logo-nav">
                <h2 onclick="window.resetAppWorkspace()" style="cursor: pointer;">
                    <svg style="color: var(--primary);" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    ShogiSign
                </h2>
                <div class="nav-links">
                    <button id="nav-workspace" class="active" onclick="window.switchView('workspace')">დოკუმენტის მართვა</button>
                    <button id="nav-archive" onclick="window.switchView('archive')">არქივი</button>
                </div>
            </div>
            <div class="user-actions">
                <span style="font-weight: 600; color: var(--text-light);">გამარჯობა, ალექსი</span>
                <button class="btn btn-outline" onclick="window.logout()">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    გასვლა
                </button>
            </div>
        </header>

        <div id="workspace-view" class="workspace-wrapper">
            <aside class="toolbar">
                <div class="file-upload-wrapper">
                    <div class="upload-btn">
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <span>ატვირთვა</span>
                    </div>
                    <input type="file" id="docInput" accept="application/pdf">
                </div>

                <div class="file-upload-wrapper">
                    <div class="upload-btn">
                        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        <span id="sigBtnText">ხელმოწერა</span>
                    </div>
                    <input type="file" id="sigInput" accept="image/*">
                </div>
                
                <img id="sigPreview" style="display:none; max-width:100%; border:1px solid #ccc; border-radius:4px; margin-top:5px;">

                <div class="doc-name-group">
                    <label>დოკუმენტის სახელი</label>
                    <input type="text" id="docNameInput" value="">
                </div>

                <hr style="border: 0; border-top: 1px solid var(--border);">
                
                <button class="btn btn-primary" id="saveArchiveBtn">
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    ატვირთვა
                </button>
                <button class="btn btn-outline" id="downloadBtn">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    გადმოწერა
                </button>
            </aside>

            <main class="canvas-area" id="canvas-area-main">
                <div class="empty-placeholder" id="emptyPlaceholder">
                    <svg style="width: 48px; height: 48px; stroke: var(--text-light);" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    <span>ხელმოსაწერი დოკუმენტი არ არის ატვირთული</span>
                </div>
                <div id="canvas-container"></div>
            </main>
        </div>

        <div id="archive-view">
            <div class="archive-header">
                <h2>არქივი</h2>
                <input type="text" id="archiveSearch" class="search-box" placeholder="ძებნა..." oninput="filterArchive()">
            </div>
            <div class="archive-grid" id="archiveGrid"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://prqphtwuopvgjejfvmwo.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBycXBodHd1b3B2Z2plamZ2bXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzk2ODAsImV4cCI6MjEwMzkxNTY4MH0.R710Je4gstv5OujKlCtQNz_piEcC3IW8dBseZxNvUpo';
        const supabaseInstance = window.supabase.createClient(supabaseUrl, supabaseKey);

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function showLoading(msg = 'გთხოვთ მოიცადოთ...') {
            document.getElementById('loading-msg').innerText = msg;
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let iconSvg = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
            if(type === 'success') iconSvg = '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
            if(type === 'error') iconSvg = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';

            toast.innerHTML = iconSvg + '<span>' + message + '</span>';
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 5000);
        }

        window.login = function() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (user === 'alex' && pass === '2911') {
                sessionStorage.setItem('isLoggedIn', 'true');
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                showToast('წარმატებით შეხვედით', 'success');
                loadCloudSignature();
            } else {
                showToast('არასწორი მონაცემები!', 'error');
            }
        };

        window.logout = function() {    
            sessionStorage.removeItem('isLoggedIn');
            location.reload();    
        };

        window.resetAppWorkspace = function() {
            window.switchView('workspace');
            document.getElementById('docInput').value = '';
            document.getElementById('docNameInput').value = '';
            canvasContainer.innerHTML = '';
            document.getElementById('emptyPlaceholder').style.display = 'flex';
            isDocLoaded = false;
            originalPdfBytes = null;
            showToast('სამუშაო სივრცე განახლდა', 'info');
        };

        window.switchView = function(view) {
            document.getElementById('nav-workspace').classList.remove('active');
            document.getElementById('nav-archive').classList.remove('active');

        function setupInteractions(container, resizer, rotator) {
            let isDragging = false, isResizing = false, isRotating = false;
            let startX, startY, startWidth, startLeft, startTop, centerX, centerY;

            container.addEventListener('pointerdown', function(e) {
                if (e.target.closest('button') || e.target === resizer || e.target === rotator) return;
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                startLeft = container.offsetLeft; startTop = container.offsetTop;
                container.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            resizer.addEventListener('pointerdown', function(e) {
                isResizing = true;
                startX = e.clientX; startY = e.clientY;
                startWidth = container.offsetWidth;
                resizer.setPointerCapture(e.pointerId);
                e.stopPropagation();
                e.preventDefault();
            });

            rotator.addEventListener('pointerdown', function(e) {
                isRotating = true;
                const rect = container.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
                rotator.setPointerCapture(e.pointerId);
                e.stopPropagation();
                e.preventDefault();
            });

            container.addEventListener('pointermove', function(e) {
                if (isDragging) {
                    container.style.left = (startLeft + (e.clientX - startX)) + 'px';
                    container.style.top = (startTop + (e.clientY - startY)) + 'px';
                } else if (isResizing) {
                    const dx = e.clientX - startX;
                    container.style.width = Math.max(50, startWidth + dx) + 'px';
                    container.style.height = 'auto';
                } else if (isRotating) {
                    const radians = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                    let degree = (radians * (180 / Math.PI)) + 90;
                    container.style.transform = `rotate(${degree}deg)`;
                    container.dataset.rotation = degree;
                }
            });

            const stopInteract = (e) => {
                isDragging = false; isResizing = false; isRotating = false;
            };

            container.addEventListener('pointerup', stopInteract);
            container.addEventListener('pointercancel', stopInteract);
        }

        async function generateOriginalQualityPDF() {
            if (!originalPdfBytes) return null;
            
            const pdfDoc = await PDFLib.PDFDocument.load(originalPdfBytes);
            const pages = pdfDoc.getPages();
            const wrappers = document.querySelectorAll('.page-wrapper');

            const sigCanvas = document.createElement('canvas');
            sigCanvas.width = sigImage.naturalWidth || sigImage.width || 300;
            sigCanvas.height = sigImage.naturalHeight || sigImage.height || 150;
            const sigCtx = sigCanvas.getContext('2d');
            sigCtx.drawImage(sigImage, 0, 0);
            const sigPngDataUrl = sigCanvas.toDataURL('image/png');
            const sigPngBytes = await fetch(sigPngDataUrl).then(res => res.arrayBuffer());
            const embeddedSigImage = await pdfDoc.embedPng(sigPngBytes);

            for (let i = 0; i < wrappers.length; i++) {
                if (i >= pages.length) break;
                const wrapper = wrappers[i];
                const canvas = wrapper.querySelector('.pdf-page');
                const sigs = wrapper.querySelectorAll('.signature-overlay');
                if (sigs.length === 0) continue;

                const page = pages[i];
                const { width: pdfWidth, height: pdfHeight } = page.getSize();
                const canvasRect = canvas.getBoundingClientRect();

                for (let j = 0; j < sigs.length; j++) {
                    const sig = sigs[j];
                    const sigRect = sig.getBoundingClientRect();

                    const domLeft = sigRect.left - canvasRect.left;
                    const domTop = sigRect.top - canvasRect.top;
                    const domWidth = sigRect.width;
                    const domHeight = sigRect.height;

                    const scaleX = pdfWidth / canvasRect.width;
                    const scaleY = pdfHeight / canvasRect.height;

                    const width = domWidth * scaleX;
                    const height = domHeight * scaleY;
                    const x = domLeft * scaleX;
                    const y = pdfHeight - (domTop + domHeight) * scaleY;

                    const rotation = parseFloat(sig.dataset.rotation || 0);

                    if (rotation === 0) {
                        page.drawImage(embeddedSigImage, {
                            x: x,
                            y: y,
                            width: width,
                            height: height,
                            blendMode: PDFLib.BlendMode.Multiply,
                            opacity: 0.93,
                        });
                    } else {
                        const radians = (rotation * Math.PI) / 180;
                        const centerX = x + width / 2;
                        const centerY = y + height / 2;

                        page.pushOperators(
                            PDFLib.pushGraphicsState(),
                            PDFLib.concatTransformationMatrix(
                                Math.cos(radians), Math.sin(radians),
                                -Math.sin(radians), Math.cos(radians),
                                centerX, centerY
                            ),
                            PDFLib.concatTransformationMatrix(1, 0, 0, 1, -width / 2, -height / 2)
                        );
                        page.drawImage(embeddedSigImage, {
                            x: 0,
                            y: 0,
                            width: width,
                            height: height,
                            blendMode: PDFLib.BlendMode.Multiply,
                            opacity: 0.93,
                        });
                        page.pushOperators(PDFLib.popGraphicsState());
                    }
                }
            }

            const pdfBytes = await pdfDoc.save();
            return pdfBytes;
        }

                link.click();
                showToast('ფაილი გადმოწერილია', 'success');
            } catch(e) {
                showToast('გადმოწერის შეცდომა: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        };

        window.showDeleteConfirmation = function(id, storagePath) {
            const footerActions = document.getElementById('modal-footer-actions');
            footerActions.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px; margin-right:auto; font-weight:600; color:#ef4444; font-size:14px;">
                    <span>ნამდვილად გსურთ დოკუმენტის წაშლა?</span>
                </div>
                <button class="btn btn-outline" onclick="openModalFromCache('${id}')">არა</button>
                <button class="btn btn-danger" onclick="executeDeleteDoc('${id}', '${storagePath}')">დიახ, წაშლა</button>
            `;
        };

        window.openModalFromCache = function(id) {
            const item = archiveDataCache.find(d => d.id == id);
            if(item) openModal(item);
        };

        window.executeDeleteDoc = async function(id, storagePath) {
            showLoading('იშლება...');
            try {
                await supabaseInstance.from('documents').delete().eq('id', id);
                if (storagePath) await supabaseInstance.storage.from('documents').remove([storagePath]);
                showToast("წაიშალა", "success");
                closeModal();
                loadArchive();
            } catch (e) { 
                showToast("წაშლა ვერ მოხერხდა: " + e.message, "error"); 
            } finally {
                hideLoading();
            }
        };

        window.closeModal = function() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('modal-pdf-container').innerHTML = '';
        }
    </script>
</body>
</html>
