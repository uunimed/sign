<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030712;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.07) 0%, transparent 60%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6;
        }

        .timer-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90vmin;
            height: 90vmin;
            max-width: 850px;
            max-height: 850px;
            z-index: 10; 
        }

        .progress-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring__circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .progress-ring__circle {
            fill: none;
            stroke: var(--accent-green);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 2512;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 8px var(--accent-green));
        }

        .timer-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .timer-label {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 300;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 6px;
        }

        .timer-display {
            font-size: 8.5vw;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* სუფთა ვერტიკალური რულერის სტილი (ციფრები ერთმანეთს რომ არ ეფარებოდეს) */
        .time-box {
            position: relative;
            display: inline-block;
            overflow: hidden;
            height: 1.1em;
            vertical-align: bottom;
            width: 2.2ch;
            text-align: center;
        }

        .time-unit {
            display: block;
            width: 100%;
            height: 100%;
            line-height: 1.1em;
        }

        .old-digit {
            position: absolute;
            top: 0;
            left: 0;
        }

        .new-digit {
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(100%);
        }

        .slide-out {
            animation: rollOut 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .slide-in {
            animation: rollIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes rollOut {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100%);
                opacity: 0;
            }
        }

        @keyframes rollIn {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .separator {
            color: rgba(16, 185, 129, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 768px) {
            .timer-display {
                font-size: 12vw;
                letter-spacing: 3px;
            }
            .timer-label {
                font-size: 1rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="timer-wrapper">
        <svg class="progress-ring" viewBox="0 0 900 900">
            <circle class="progress-ring__circle-bg" cx="450" cy="450" r="400"></circle>
            <circle id="progressCircle" class="progress-ring__circle" cx="450" cy="450" r="400"></circle>
        </svg>

        <div class="timer-content">
            <div class="timer-label">დარჩენილია</div>
            <div class="timer-display">
                <div class="time-box"><span id="hours" class="time-unit">00</span></div>
                <span class="separator">:</span>
                <div class="time-box"><span id="minutes" class="time-unit">00</span></div>
                <span class="separator">:</span>
                <div class="time-box"><span id="seconds" class="time-unit">00</span></div>
            </div>
        </div>
    </div>

    <script>
        const radius = 400;
        const circumference = 2 * Math.PI * radius;
        const circle = document.getElementById('progressCircle');
        
        circle.style.strokeDasharray = circumference;

        function updateElementText(elementId, newValue) {
            const currentEl = document.getElementById(elementId);
            if (currentEl.textContent === newValue) return;

            const container = currentEl.parentElement;

            // ძველი ციფრის ამოღება და ზემოთ აცილება
            const oldEl = document.createElement('span');
            oldEl.className = 'time-unit old-digit';
            oldEl.textContent = currentEl.textContent;
            container.appendChild(oldEl);

            // ახალი ციფრის მომზადება ქვემოდან ამოსასვლელად
            currentEl.textContent = newValue;
            currentEl.classList.add('new-digit');

            // Reflow-ს გამოძახება
            void currentEl.offsetWidth;

            // ანიმაციების გაშვება
            oldEl.classList.add('slide-out');
            currentEl.classList.add('slide-in');

            // ძველი ელემენტის წაშლა ანიმაციის დასრულების შემდეგ
            setTimeout(() => {
                oldEl.remove();
                currentEl.classList.remove('new-digit', 'slide-in');
            }, 800);
        }

        function updateTimer() {
            const now = new Date();
            
            let targetTime = new Date();
            targetTime.setHours(9, 0, 0, 0);

            const totalCycleTime = 24 * 60 * 60 * 1000;

            if (now >= targetTime) {
                targetTime.setDate(targetTime.getDate() + 1);
            }

            const diff = targetTime - now;

            const hours = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            const minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

            updateElementText('hours', hours);
            updateElementText('minutes', minutes);
            updateElementText('seconds', seconds);

            let progressFraction = diff / totalCycleTime;
            if (progressFraction > 1) progressFraction = 1;
            if (progressFraction < 0) progressFraction = 0;
            
            const offset = circumference - (progressFraction * circumference);
            circle.style.strokeDashoffset = offset;
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // Canvas ანიმაცია ფონისთვის
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 150;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * width
                });
            }
        }

        function moveStars() {
            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                star.z -= 1;
                if (star.z <= 0) {
                    star.z = width;
                    star.x = Math.random() * width;
                    star.y = Math.random() * height;
                }
            }
        }

        function drawStars() {
            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                const x = (star.x - width / 2) * (width / star.z) + width / 2;
                const y = (star.y - height / 2) * (width / star.z) + height / 2;
                const px = (width / star.z) * 1.5;
                
                ctx.beginPath();
                ctx.arc(x, y, px, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(16, 185, 129, ${1 - star.z / width})`;
                ctx.fill();
            }
        }

        function animate() {
            moveStars();
            drawStars();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        createStars();
        animate();
    </script>
</body>
</html>
