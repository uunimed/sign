<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030712;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent-color: #00f2fe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.07) 0%, transparent 60%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6;
        }

        .timer-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
            padding: 20px;
        }

        .timer-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .timer-label {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 300;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 6px;
        }

        .timer-group {
            display: flex;
            flex-direction: column;
            width: fit-content;
            align-items: center;
            gap: 20px;
        }

        .timer-display {
            font-size: 13.5vw;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--text-primary);
            display: grid;
            place-items: center;
            width: 100%;
            min-height: 1.2em;
        }

        /* სადა და ნაზი გადასვლა CSS Grid-ის მეშვეობით */
        .transition-view {
            grid-area: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
        }

        .transition-view.active {
            opacity: 1;
            visibility: visible;
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .progress-bar-fill {
            width: 100%;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 8px;
            box-shadow: 0 0 16px var(--accent-color);
            transition: width 1s linear, background-color 0.5s ease, box-shadow 0.5s ease;
        }

        .time-box {
            position: relative;
            display: inline-block;
            overflow: hidden;
            height: 1.1em;
            vertical-align: bottom;
            width: 2.2ch;
            text-align: center;
        }

        .time-unit {
            display: block;
            width: 100%;
            height: 100%;
            line-height: 1.1em;
        }

        .old-digit {
            position: absolute;
            top: 0;
            left: 0;
        }

        .new-digit {
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(100%);
        }

        .slide-out {
            animation: rollOut 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .slide-in {
            animation: rollIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes rollOut {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-100%);
                opacity: 0;
            }
        }

        @keyframes rollIn {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .separator {
            color: #00f2fe; /* ფიქსირებული ფერი, რომელიც არ შეიცვლება */
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .blinking-text {
            animation: blink 0.8s infinite;
        }

        @media (max-width: 768px) {
            .timer-display {
                font-size: 15vw;
                letter-spacing: 2px;
            }
            .timer-label {
                font-size: 1rem;
                letter-spacing: 3px;
            }
            .progress-bar-container {
                height: 12px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="timer-wrapper">
        <div class="timer-content">
            <div class="timer-label">დარჩენილია</div>
            
            <div class="timer-group">
                <div class="timer-display">
                    <div id="clockContainer" class="transition-view active">
                        <div class="time-box"><span id="hours" class="time-unit">00</span></div>
                        <span class="separator">:</span>
                        <div class="time-box"><span id="minutes" class="time-unit">00</span></div>
                        <span class="separator">:</span>
                        <div class="time-box"><span id="seconds" class="time-unit">00</span></div>
                    </div>
                    <div id="alertText" class="transition-view" style="font-size: 8vw; font-weight: 900; color: #ef4444; white-space: nowrap;">
                        <span class="blinking-text">მორიგეობა სრულდება</span>
                    </div>
                </div>
                
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        
        function updateElementText(elementId, newValue) {
            const currentEl = document.getElementById(elementId);
            if (currentEl.textContent === newValue) return;

            const container = currentEl.parentElement;

            const oldEl = document.createElement('span');
            oldEl.className = 'time-unit old-digit';
            oldEl.textContent = currentEl.textContent;
            container.appendChild(oldEl);

            currentEl.textContent = newValue;
            currentEl.classList.add('new-digit');

            void currentEl.offsetWidth;

            oldEl.classList.add('slide-out');
            currentEl.classList.add('slide-in');

            setTimeout(() => {
                oldEl.remove();
                currentEl.classList.remove('new-digit', 'slide-in');
            }, 800);
        }

        function updateTimer() {
            const now = new Date();
            
            let targetTime = new Date();
            targetTime.setHours(9, 0, 0, 0);

            const totalCycleTime = 24 * 60 * 60 * 1000;

            if (now >= targetTime) {
                targetTime.setDate(targetTime.getDate() + 1);
            }

            const diff = targetTime - now;

            const hours = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            const minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

            updateElementText('hours', hours);
            updateElementText('minutes', minutes);
            updateElementText('seconds', seconds);

            let progressFraction = diff / totalCycleTime;
            if (progressFraction > 1) progressFraction = 1;
            if (progressFraction < 0) progressFraction = 0;
            
            progressBar.style.width = (progressFraction * 100) + '%';

            // ბოლო 30 წუთი (30 * 60 * 1000 მილიწამი)
            const alertThreshold = 30 * 60 * 1000;

            // ფერის ცვლილება მწვანიდან წითლამდე
            let activeColor;
            if (diff <= alertThreshold) {
                activeColor = '#ef4444'; // მკვეთრი წითელი ბოლო 30 წუთში
            } else {
                const hue = progressFraction * 120;
                activeColor = `hsl(${hue}, 100%, 50%)`;
            }
            document.documentElement.style.setProperty('--accent-color', activeColor);

            // ბოლო 30 წუთში წამზომისა და ტექსტის მონაცვლეობა (პირველი 5 წამი წამზომი, შემდეგი 5 წამი ტექსტი)
            const clockContainer = document.getElementById('clockContainer');
            const alertText = document.getElementById('alertText');

            if (diff <= alertThreshold && diff > 0) {
                clockContainer.style.color = '#ef4444'; // წამზომი მუქი/მკვეთრი წითელი ბოლო 30 წუთში
                const isTimerPhase = Math.floor(diff / 5000) % 2 === 0;
                if (isTimerPhase) {
                    clockContainer.classList.add('active');
                    alertText.classList.remove('active');
                } else {
                    clockContainer.classList.remove('active');
                    alertText.classList.add('active');
                }
            } else {
                clockContainer.style.color = '#ffffff';
                clockContainer.classList.add('active');
                alertText.classList.remove('active');
            }
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // Canvas ანიმაცია ფონისთვის
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 150;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * width
                });
            }
        }

        function moveStars() {
            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                star.z -= 1;
                if (star.z <= 0) {
                    star.z = width;
                    star.x = Math.random() * width;
                    star.y = Math.random() * height;
                }
            }
        }

        function drawStars() {
            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                const x = (star.x - width / 2) * (width / star.z) + width / 2;
                const y = (star.y - height / 2) * (width / star.z) + height / 2;
                const px = (width / star.z) * 1.5;
                
                ctx.beginPath();
                ctx.arc(x, y, px, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 242, 254, ${1 - star.z / width})`;
                ctx.fill();
            }
        }

        function animate() {
            moveStars();
            drawStars();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        createStars();
        animate();
    </script>
</body>
</html>
